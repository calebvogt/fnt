site_name: Field Neuroethology Toolbox
site_description: >-
  Preprocessing and analysis toolbox for field and laboratory
  neurobehavioral data.
site_author: Caleb C. Vogt
site_url: https://calebvogt.github.io/fnt/
repo_url: https://github.com/calebvogt/fnt
repo_name: calebvogt/fnt
copyright: Copyright &copy; Caleb C. Vogt and contributors

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
  - Tools:
      - Audio / USV: tools/audio.md
      - Video Processing: tools/video-processing.md
      - Video Tracking: tools/video-tracking.md
      - UWB Tracking: tools/uwb.md
      - Imaging: tools/imaging.md
  - MAD Detector:
      - Overview: mad/overview.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

plugins:
  - search
